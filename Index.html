<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tojir Plast</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #087f5b, #20c997);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #173b32;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 18px;
      background: #087f5b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin: 0;
      color: #087f5b;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      margin: 8px 0 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid #d8e2df;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #20c997;
      box-shadow: 0 0 0 3px rgba(32, 201, 151, 0.2);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      background: #087f5b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #066b4d;
      transform: translateY(-1px);
    }

    .footer {
      text-align: center;
      color: #9aa6a2;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">TP</div>

    <h1>Tojir Plast</h1>
    <div class="subtitle">Учет пластиковой продукции</div>

    <form id="productForm">
      <label for="product">Название продукта</label>
      <input
        type="text"
        id="product"
        placeholder="Например: Пластиковая бочка"
        required
        maxlength="100"
      >

      <label for="quantity">Количество</label>
      <input
        type="number"
        id="quantity"
        placeholder="Введите количество"
        min="1"
        required
      >

      <button type="submit">Создать QR код</button>
    </form>

    <div class="footer">
      © 2026 Tojir Plast
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    document.getElementById("productForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const product = document.getElementById("product").value.trim();
      const quantity = Number(document.getElementById("quantity").value);

      /*const orderData = {
        product: product,
        quantity: quantity
      };*/

const ids = Array.from(
  { length: quantity },
  (_, index) => `T-${String(index + 1).padStart(6, '0')}`
);

sendZplLabels(product, ids);


      /*tg.sendData(JSON.stringify(orderData));*/
      tg.close();
    });



     const PRINTER_SERVICE_UUID =
  '000018f0-0000-1000-8000-00805f9b34fb';

const PRINTER_CHARACTERISTIC_UUID =
  '00002af1-0000-1000-8000-00805f9b34fb';

function escapeZpl(value) {
  return String(value)
    .replace(/\^/g, ' ')
    .replace(/~/g, ' ');
}

function createZplLabel(name, id) {
  return `
^XA
^PW462
^LL319
^CI28
^FO0,20
^FB462,1,0,C,0
^ADN,35,20
^FD${escapeZpl(name)}^FS
^FO110,80
^BQN,7,25
^FDQA,${escapeZpl(id)}^FS
^XZ
`.replace(/\n/g, '');
}

function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function sendZplLabels(name, ids) {
  let device;
  let server;

  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'XP-420B' }],
      optionalServices: [PRINTER_SERVICE_UUID]
    });

    server = await device.gatt.connect();

    const service = await server.getPrimaryService(
      PRINTER_SERVICE_UUID
    );

    const characteristic = await service.getCharacteristic(
      PRINTER_CHARACTERISTIC_UUID
    );

    const encoder = new TextEncoder();

    for (let i = 0; i < ids.length; i++) {
      const zpl = createZplLabel(name, ids[i]);
      const data = encoder.encode(zpl);

      // Отправка частями, чтобы не превысить лимит Bluetooth
      const chunkSize =  hundredOrDefault(characteristic);

      for (let start = 0; start < data.length; start += chunkSize) {
        const chunk = data.slice(start, start + chunkSize);

        if (characteristic.writeValueWithResponse) {
          await characteristic.writeValueWithResponse(chunk);
        } else {
          await characteristic.writeValue(chunk);
        }

        await delay(30);
      }

      console.log(`Этикетка ${i + 1}/${ids.length} отправлена`);
      await delay(300);
    }

    console.log('Все этикетки успешно отправлены');

  } catch (error) {
    console.error('Ошибка печати:', error);
  } finally {
    if (server?.connected) {
      server.disconnect();
    }
  }
}

function hundredOrDefault(characteristic) {
  // Безопасный размер пакета для большинства Bluetooth-принтеров
  return 100;
}




  </script>
</body>
</html>
